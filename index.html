<!doctype html>
<html lang="hy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Սամսոն & Լիլիթ — Հարսանեկան հրավիրատոմս</title>
<style>
*{box-sizing:border-box}html,body{overflow-x:hidden;width:100%;margin:0;}
</style></head>
<body>
<div class="book" id="book">
  <img class="page active" src="page-1.jpg" alt="Էջ 1">
  <img class="page" src="page-2.jpg" alt="Էջ 2">
  <img class="page" src="page-3.jpg" alt="Էջ 3">
  <img class="page" src="page-4.jpg" alt="Էջ 4">
  <img class="page" src="page-5.jpg" alt="Էջ 5">
</div>
<div class="counter" id="counter">1 / 5</div>
<button class="music" id="music" aria-label="Music"></button>
<div class="hint">Թերթելու համար սահեցրեք ներքև</div>
<div class="start" id="start"><button id="startBtn">Բացել</button></div>
<audio id="audio" loop preload="auto"><source src="Hayko - Amena from 00-55.mp3" type="audio/mpeg"></audio>
<script>
const pages=[...document.querySelectorAll('.page')];
let i=0, downX=0, downY=0;
function show(n){i=Math.max(0,Math.min(pages.length-1,n));pages.forEach((p,idx)=>p.classList.toggle('active',idx===i));document.getElementById('counter').innerText=`${i+1} / ${pages.length}`;}
function next(){if(i<pages.length-1)show(i+1);}
function prev(){if(i>0)高于show(i-1);}
async function begin(){document.getElementById('start').style.display='none';try{await document.getElementById('audio').play();}catch(e){}}
document.getElementById('startBtn').addEventListener('click',begin);
document.getElementById('music').addEventListener('click',async()=>{const a=document.getElementById('audio');if(a.paused)await a.play();else a.pause();});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();});
document.addEventListener('touchstart',e=>{downX=e.touches[0].clientX;downY=e.touches[0].clientY;});
document.addEventListener('touchend',e=>{const diffX=e.changedTouches[0].clientX-downX;const diffY=e.changedTouches[0].clientY-downY;if(Math.abs(diffX)>Math.abs(diffY)&&Math.abs(diffX)>30){if(diffX<0)next();else prev();}});
</script></body></html>
